<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="format-detection" content="telephone=no">
<title>甜甜</title>
<style>
:root{
  --bg:#05060a;
  --ink:#f4f1ea;
  --dim:#7d7a8a;
  --warm:#ff9dbb;
  --warm-soft:#ffc6d8;
  --cool:#a99cf0;
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC",STSong,"Song Ti",SimSun,"Times New Roman",Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif)}
body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stars{z-index:1}
#fx{z-index:2}

.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,rgba(90,70,150,.10) 0%,rgba(5,6,10,0) 45%,rgba(0,0,0,.72) 100%)}

.scene{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(22px,5vh,44px);
  padding:clamp(24px,7vw,64px);text-align:center;
  opacity:0;pointer-events:none;transition:opacity 1.15s ease}
.scene.on{opacity:1;pointer-events:auto}
.scene.gone{opacity:0;pointer-events:none}

.line{font-size:clamp(17px,4.4vw,25px);letter-spacing:.2em;line-height:2.05;
  font-weight:400;color:var(--ink);max-width:19em;text-indent:.2em}
.line em{font-style:normal;color:var(--warm-soft)}
.line .ch{display:inline-block;opacity:0;transform:translateY(9px);filter:blur(4px);
  animation:chIn 1.25s cubic-bezier(.22,.68,.3,1) forwards}
@keyframes chIn{to{opacity:1;transform:translateY(0);filter:blur(0)}}

.hint{font-size:clamp(11px,3vw,13px);letter-spacing:.42em;text-indent:.42em;color:var(--dim);
  opacity:0;transition:opacity 1.6s ease;font-weight:400}
.hint.on{opacity:1;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.34}50%{opacity:.92}}

/* ---- 序幕的微光 ---- */
.orb{width:14px;height:14px;border-radius:50%;background:var(--cool);
  box-shadow:0 0 18px 5px rgba(169,156,240,.55),0 0 62px 22px rgba(169,156,240,.16);
  cursor:pointer;position:relative;
  animation:pulse 4.2s cubic-bezier(.45,.05,.55,.95) infinite}
.orb::after{content:"";position:absolute;inset:-40px;border-radius:50%}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.72}50%{transform:scale(1.5);opacity:1}}
.orb .halo{position:absolute;inset:-46px;border-radius:50%;pointer-events:none;
  border:1px solid rgba(169,156,240,.13);animation:halo 5.5s ease-out infinite}
@keyframes halo{0%{transform:scale(.42);opacity:.85}100%{transform:scale(1.75);opacity:0}}
.orb.warm{background:var(--warm);box-shadow:0 0 20px 6px rgba(255,157,187,.6),0 0 70px 26px rgba(255,157,187,.18)}

/* ---- 照片卡 ---- */
.card{position:absolute;left:50%;top:50%;z-index:6;
  transform:translate(-50%,-50%) scale(.55);opacity:0;pointer-events:none;
  transition:transform 1.05s cubic-bezier(.2,.75,.25,1),opacity .8s ease;
  display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3.4vw,24px);
  width:min(78vw,420px)}
.card.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.card img{width:100%;max-height:min(56vh,520px);object-fit:contain;border-radius:3px;
  box-shadow:0 26px 80px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.07);
  filter:saturate(.94) contrast(1.02)}
.card p{font-size:clamp(14px,3.7vw,18px);letter-spacing:.16em;line-height:1.9;
  color:var(--warm-soft);text-indent:.16em}

/* ---- 已收集的光点 ---- */
.strip{position:absolute;top:clamp(26px,7vh,58px);left:50%;transform:translateX(-50%);
  display:flex;gap:clamp(14px,4vw,22px);z-index:6}
.dot{width:7px;height:7px;border-radius:50%;background:#2b2937;transition:all .9s ease}
.dot.on{background:var(--warm);box-shadow:0 0 12px 3px rgba(255,157,187,.55)}

.counter{position:absolute;bottom:clamp(26px,7vh,58px);left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.4em;color:var(--dim);opacity:0;transition:opacity .8s ease}
.counter.on{opacity:.75}

/* ---- 长按 ---- */
.hold{position:relative;width:clamp(112px,30vw,150px);height:clamp(112px,30vw,150px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
.hold svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hold .track{fill:none;stroke:rgba(255,255,255,.09);stroke-width:1.5}
.hold .prog{fill:none;stroke:var(--warm);stroke-width:1.5;stroke-linecap:round;
  filter:drop-shadow(0 0 6px rgba(255,157,187,.7))}
.hold span{font-size:clamp(11px,2.9vw,13px);letter-spacing:.3em;text-indent:.3em;color:var(--dim);
  position:relative;z-index:2;transition:color .5s ease;max-width:5.4em;line-height:1.7}
.hold.act span{color:var(--warm-soft)}

/* ---- 终章（两页信纸，交叉淡入淡出） ---- */
.letter-stack{position:relative;width:min(84vw,380px)}
.letter-stack img{width:100%;max-height:58vh;object-fit:contain;border-radius:3px;display:block;
  box-shadow:0 30px 90px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.08);
  opacity:0;transform:scale(.94) translateY(14px);
  transition:opacity 1.6s ease,transform 1.6s cubic-bezier(.2,.75,.25,1)}
.letter-stack img#letter2{position:absolute;inset:0;height:100%}
.letter-stack img.on{opacity:.94;transform:scale(1) translateY(0)}
.letter-stack img.off{opacity:0;transform:scale(1.05) translateY(-10px);
  transition:opacity 1.05s ease,transform 1.05s ease}

.replay{position:absolute;bottom:clamp(24px,6vh,54px);left:50%;transform:translateX(-50%);
  background:none;border:1px solid rgba(255,255,255,.16);color:var(--dim);
  font-family:var(--serif);font-size:12px;letter-spacing:.34em;text-indent:.34em;
  padding:11px 24px 11px 28px;border-radius:999px;cursor:pointer;
  opacity:0;transition:opacity 1.4s ease,color .4s ease,border-color .4s ease}
.replay.on{opacity:.6}
.replay:hover{color:var(--ink);border-color:rgba(255,255,255,.34)}

.sound{position:absolute;top:clamp(16px,4vh,30px);right:clamp(16px,4vw,30px);z-index:9;
  width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.02);display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:0;transition:opacity 1.2s ease}
.sound.on{opacity:.55}
.sound:hover{opacity:1}
.sound i{display:block;width:2px;background:var(--dim);border-radius:2px}
.sound i:nth-child(1){height:7px;margin-right:2px}
.sound i:nth-child(2){height:12px}
.sound i:nth-child(3){height:9px;margin-left:2px}
.sound.mute i{height:3px !important;background:#4a4854}

.fadeout{position:absolute;inset:0;background:#05060a;z-index:8;pointer-events:none;
  opacity:0;transition:opacity .9s ease}
.fadeout.on{opacity:1}

@media (prefers-reduced-motion:reduce){
  .orb,.orb .halo,.hint.on{animation:none}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="fx"></canvas>
<div class="vignette"></div>

<div class="sound" id="sound" aria-label="声音开关"><i></i><i></i><i></i></div>

<!-- 1 序幕 -->
<section class="scene" id="s1">
  <div class="orb" id="orb1"><span class="halo"></span></div>
  <p class="line" id="line1"></p>
  <p class="hint" id="hint1">轻触这粒光</p>
</section>

<!-- 2 唤醒 -->
<section class="scene" id="s2">
  <p class="line" data-tw>其实有太多话想和你说，<br>只是不知道该从哪里说起。</p>
  <p class="hint" id="hint2">轻触继续</p>
</section>

<!-- 3 回忆 -->
<section class="scene" id="s3">
  <div class="strip" id="strip"></div>
  <div class="orb warm" id="orb3"><span class="halo"></span></div>
  <div class="card" id="card"><img id="cardImg" alt=""><p id="cardCap"></p></div>
  <p class="hint" id="hint3">点亮它</p>
  <div class="counter" id="counter"></div>
</section>

<!-- 4 靠近 -->
<section class="scene" id="s4">
  <p class="line" data-tw>我把这些日子，<br>一颗一颗收好了。</p>
  <div class="hold" id="hold">
    <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="45"></circle><circle class="prog" id="prog" cx="50" cy="50" r="45"></circle></svg>
    <span id="holdTxt">按住，别松手</span>
  </div>
</section>

<!-- 5 揭晓 -->
<section class="scene" id="s5">
  <div class="letter-stack">
    <img id="letter" alt="">
    <img id="letter2" alt="">
  </div>
  <p class="line" id="line5">我真的很喜欢你。</p>
  <button class="replay" id="replay">再看一次</button>
</section>

<div class="fadeout" id="fadeout"></div>

/* ============ 工具 ============ */
function $(id){return document.getElementById(id)}
function lerp(a,b,t){return a+(b-a)*t}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function clamp(v,a,b){return v<a?a:v>b?b:v}

/* 逐字浮现 */
function typeLine(el,text,startDelay,perChar,after){
  el.innerHTML='';
  var i,sp;
  for(i=0;i<text.length;i++){
    if(text[i]==='\n'){el.appendChild(document.createElement('br'));continue}
    sp=document.createElement('span');
    sp.className='ch';sp.textContent=text[i];
    sp.style.animationDelay=(startDelay+i*perChar)+'s';
    el.appendChild(sp);
  }
  if(after)setTimeout(after,startDelay*1000+text.length*perChar*1000+1250);
}

/* ============ 星空 ============ */
var cvS=$('stars'),cxS=cvS.getContext('2d');
var cvF=$('fx'),cxF=cvF.getContext('2d');
var W=0,H=0,DPR=1;
var stars=[],starA=0,starTarget=0,shoot=null,shootT=0;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  [cvS,cvF].forEach(function(c){
    c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);
    c.getContext('2d').setTransform(DPR,0,0,DPR,0,0);
  });
  buildStars();
  layoutDots();
  glowGrad=cxF.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.56);
  glowGrad.addColorStop(0,'rgba(255,157,187,.11)');
  glowGrad.addColorStop(.45,'rgba(200,150,220,.045)');
  glowGrad.addColorStop(1,'rgba(255,157,187,0)');
  if(P.phase==='text'||P.phase==='settle')buildTextTargets();
}
function buildStars(){
  var n=clamp(Math.round(W*H/8200),90,420);stars=[];
  for(var i=0;i<n;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.15+.28,
      a:Math.random()*.62+.16,
      ph:Math.random()*Math.PI*2,
      sp:Math.random()*.018+.004
    });
  }
}
function drawStars(dt){
  cxS.clearRect(0,0,W,H);
  if(starA<=.001)return;
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    s.ph+=dt*s.sp;
    s.y+=dt*3.2; if(s.y>H+4)s.y=-4;
    var tw=.62+.38*Math.sin(s.ph);
    cxS.globalAlpha=starA*s.a*tw;
    cxS.fillStyle='#dfe4ff';
    cxS.beginPath();cxS.arc(s.x,s.y,s.r,0,6.2832);cxS.fill();
  }
  cxS.globalAlpha=1;
  /* 偶发流星 */
  if(!shoot&&Math.random()<.0016&&starA>.6){
    shoot={x:Math.random()*W*.7,y:Math.random()*H*.35,vx:520+Math.random()*220,vy:150+Math.random()*70,life:0};
  }
  if(shoot){
    shoot.life+=dt;shoot.x+=shoot.vx*dt;shoot.y+=shoot.vy*dt;
    var k=Math.max(0,1-shoot.life/1.5);
    var g=cxS.createLinearGradient(shoot.x,shoot.y,shoot.x-90,shoot.y-26);
    g.addColorStop(0,'rgba(255,225,240,'+(.5*k*starA)+')');
    g.addColorStop(1,'rgba(255,225,240,0)');
    cxS.strokeStyle=g;cxS.lineWidth=1.4;cxS.beginPath();
    cxS.moveTo(shoot.x,shoot.y);cxS.lineTo(shoot.x-90,shoot.y-26);cxS.stroke();
    if(shoot.life>1.5)shoot=null;
  }
}

/* ============ 粒子（汇聚成字 / 爆散） ============ */
var P={parts:[],phase:'idle',t:0,burst:[]};

function burst(x,y,n,color,power){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,sp=(Math.random()*.8+.25)*power;
    P.burst.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:Math.random()*1.6+.5,
      life:0,max:1.1+Math.random()*1.3,c:color});
  }
}

var textLines=[],textSize=0,textTargets=[],glowGrad=null;
function textLayout(){
  var portrait=H>W*1.12;
  textLines = portrait?['甜甜，','我喜欢你']:['甜甜，我喜欢你'];
  var maxChars=0,i;
  for(i=0;i<textLines.length;i++)maxChars=Math.max(maxChars,textLines[i].length);
  var availW=W*(portrait?.86:.78);
  textSize=Math.min(availW/maxChars, H*(portrait?.20:.30));
  textSize=Math.max(textSize, 30);
}
function buildTextTargets(){
  textLayout();
  var lh=textSize*1.2;
  var y0=H/2-(textLines.length-1)*lh/2;
  var stepCss=Math.max(1.6, textSize/58);
  var stepDev=Math.max(1,stepCss*DPR);
  var fam=getComputedStyle(document.body).fontFamily;
  var off=document.createElement('canvas');
  off.width=Math.round(W*DPR);off.height=Math.round(H*DPR);
  var o=off.getContext('2d');
  var dw=off.width,dh=off.height;
  var pts=[],minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;

  for(var i=0;i<textLines.length;i++){
    o.setTransform(1,0,0,1,0,0);
    o.clearRect(0,0,dw,dh);
    o.setTransform(DPR,0,0,DPR,0,0);
    o.fillStyle='#fff';o.textAlign='left';o.textBaseline='middle';
    o.font='400 '+textSize+'px '+fam;
    var tw=o.measureText(textLines[i]).width;
    o.fillText(textLines[i],(W-tw)/2,y0+i*lh);
    var img=o.getImageData(0,0,dw,dh).data;
    var lmin=1e9,lmax=-1e9,lpts=[];
    for(var Y=0;Y<dh;Y+=stepDev){
      var yi=Y|0;                 /* 采样步长常为非整数，像素索引必须取整 */
      for(var X=0;X<dw;X+=stepDev){
        var xi=X|0;
        if(img[(yi*dw+xi)*4+3]>128){
          var cx=xi/DPR,cy=yi/DPR;
          lpts.push({x:cx,y:cy});
          if(cx<lmin)lmin=cx; if(cx>lmax)lmax=cx;
          if(cy<minY)minY=cy; if(cy>maxY)maxY=cy;
          if(cx<minX)minX=cx; if(cx>maxX)maxX=cx;
        }
      }
    }
    /* 按实际墨迹居中，抵消全角标点带来的偏移 */
    var dx=(W/2)-(lmin+lmax)/2;
    for(var k=0;k<lpts.length;k++){lpts[k].x+=dx;pts.push(lpts[k])}
  }
  var dy=(H/2)-(minY+maxY)/2;
  for(var m=0;m<pts.length;m++)pts[m].y+=dy;

  if(pts.length>5000){
    var q=Math.ceil(pts.length/5000),keep=[];
    for(var j=0;j<pts.length;j+=q)keep.push(pts[j]);
    pts=keep;
  }
  textTargets=pts;
  P.parts=pts.map(function(p){
    var a=Math.random()*Math.PI*2,d=Math.random()*Math.max(W,H)*.55+90;
    return {x:W/2+Math.cos(a)*d, y:H/2+Math.sin(a)*d*1.1,
      tx:p.x, ty:p.y, px:p.x, py:p.y,
      r:Math.random()*.95+.5, ph:Math.random()*6.28};
  });
  P.phase='fly';P.t=0;
}

function drawFX(dt){
  cxF.clearRect(0,0,W,H);
  /* 爆散粒子 */
  for(var i=P.burst.length-1;i>=0;i--){
    var b=P.burst[i];b.life+=dt;
    if(b.life>b.max){P.burst.splice(i,1);continue}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.985;b.vy*=.985;b.vy+=18*dt;
    var k=1-b.life/b.max;
    cxF.globalAlpha=k*k*.85;
    cxF.fillStyle=b.c;
    cxF.beginPath();cxF.arc(b.x,b.y,b.r*k,0,6.2832);cxF.fill();
  }
  cxF.globalAlpha=1;

  if(P.phase==='idle'||!P.parts.length)return;
  P.t+=dt;
  var t=clamp(P.t/2.9,0,1),e=ease(t);
  var glow=P.phase==='settle'?1:0;
  if(glow&&glowGrad){
    cxF.globalAlpha=.9;
    cxF.fillStyle=glowGrad;
    cxF.fillRect(0,0,W,H);
  }
  cxF.fillStyle=glow?'#ffd6e6':'#c9c2f5';
  for(var j=0;j<P.parts.length;j++){
    var p=P.parts[j];
    var wob=Math.sin(P.t*1.6+p.ph)*2.4*(1-e);
    p.px=lerp(p.x,p.tx,e)+wob;
    p.py=lerp(p.y,p.ty,e)+wob*.6;
    cxF.globalAlpha=(.30+.70*e)*(0.60+0.40*Math.sin(P.t*2.1+p.ph));
    var s=p.r*2.1;
    cxF.fillRect(p.px-s*.5,p.py-s*.5,s,s);
  }
  cxF.globalAlpha=1;
  if(t>=1&&P.phase==='fly'){P.phase='text';setTimeout(function(){P.phase='settle'},900)}
}

/* ============ 音频（程序化合成） ============ */
var AC=null,AM=null,padGain=null,muted=false,noteIdx=0;
var SCALE=[440.00,523.25,587.33,659.25,783.99,880.00,1046.50,1174.66];
function makeImpulse(sec,decay){
  var rate=AC.sampleRate,len=Math.round(rate*sec),buf=AC.createBuffer(2,len,rate);
  for(var c=0;c<2;c++){
    var d=buf.getChannelData(c);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
  }
  return buf;
}
function initAudio(){
  if(AC)return;
  var Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)return;
  AC=new Ctx();
  AM=AC.createGain();AM.gain.value=0;
  var conv=AC.createConvolver();conv.buffer=makeImpulse(3.6,2.6);
  var wet=AC.createGain();wet.gain.value=.42;
  AM.connect(AC.destination);
  AM.connect(conv);conv.connect(wet);wet.connect(AC.destination);
  /* 环境垫音：A 小调 */
  padGain=AC.createGain();padGain.gain.value=.055;
  var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.Q.value=.6;
  var lfo=AC.createOscillator();lfo.frequency.value=.045;
  var lfoG=AC.createGain();lfoG.gain.value=180;
  lfo.connect(lfoG);lfoG.connect(lp.frequency);lfo.start();
  padGain.connect(lp);lp.connect(AM);
  [110.00,164.81,220.00,329.63].forEach(function(f,i){
    var o=AC.createOscillator();o.type=i%2?'sine':'triangle';
    o.frequency.value=f*(1+(Math.random()-.5)*.0016);
    var g=AC.createGain();g.gain.value=[.5,.32,.24,.13][i];
    o.connect(g);g.connect(padGain);o.start();
  });
  AM.gain.linearRampToValueAtTime(.9,AC.currentTime+7);
}
function note(freq,vol){
  if(!AC||muted)return;
  var t=AC.currentTime;
  var g=AC.createGain();g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+3.4);
  var o1=AC.createOscillator();o1.type='sine';o1.frequency.value=freq;
  var o2=AC.createOscillator();o2.type='triangle';o2.frequency.value=freq*2.003;
  var g2=AC.createGain();g2.gain.value=.16;
  o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(AM);
  o1.start(t);o2.start(t);o1.stop(t+3.6);o2.stop(t+3.6);
}
function chime(){note(SCALE[noteIdx%SCALE.length],.16);noteIdx++}
function soundToggle(){
  muted=!muted;
  $('sound').classList.toggle('mute',muted);
  if(AM)AM.gain.linearRampToValueAtTime(muted?0:.9,AC.currentTime+.5);
}

/* ============ 场景机 ============ */
var cur='';
function show(id){
  ['s1','s2','s3','s4','s5'].forEach(function(s){
    var el=$(s);
    if(s===id){el.classList.add('on');el.classList.remove('gone')}
    else{el.classList.remove('on');el.classList.add('gone')}
  });
  cur=id;
}
function fade(cb){
  var f=$('fadeout');f.classList.add('on');
  setTimeout(function(){cb();setTimeout(function(){f.classList.remove('on')},120)},880);
}

/* --- 场景 1 --- */
function scene1(){
  show('s1');
  starTarget=0;
  var o=$('orb1');
  o.style.opacity=0;o.style.transition='opacity 2.2s ease';
  setTimeout(function(){o.style.opacity=1},350);
  typeLine($('line1'),'甜甜，有你真好',2.4,.17,function(){
    $('hint1').classList.add('on');
    $('s1').dataset.ready='1';
  });
}

/* --- 场景 2 --- */
function scene2(){
  show('s2');
  starTarget=1;
  var el=$('s2').querySelector('.line');
  el.innerHTML='';
  setTimeout(function(){
    typeLine(el,'其实有太多话想和你说，\n只是不知道该从哪里说起。',0,.075,function(){
      $('hint2').classList.add('on');
    });
  },900);
}

/* --- 场景 3 --- */
var fragIdx=0;
function layoutDots(){
  var s=$('strip');if(!s)return;
  s.innerHTML='';
  for(var i=0;i<FRAGS.length;i++){
    var d=document.createElement('div');d.className='dot';d.id='dot'+i;s.appendChild(d);
  }
  for(var j=0;j<fragIdx;j++){var e=$('dot'+j);if(e)e.classList.add('on')}
}
function scene3(){
  show('s3');starTarget=1;
  fragIdx=0;layoutDots();
  var el=$('s3').querySelector('.line');
  showFrag(0);
}
function showFrag(i){
  fragIdx=i;
  $('counter').textContent=(i+1)+' / '+FRAGS.length;
  $('counter').classList.add('on');
  $('hint3').textContent='点亮它';$('hint3').classList.add('on');
  var o=$('orb3');
  o.style.pointerEvents='auto';
  o.style.transition='none';o.style.opacity=0;o.style.transform='scale(.3)';
  o.style.display='';
  setTimeout(function(){
    o.style.transition='opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.75,.25,1)';
    o.style.opacity=1;o.style.transform='scale(1)';
  },60);
  $('card').classList.remove('on');
  $('s3').dataset.step='orb';
}
function openCard(i){
  if($('s3').dataset.step!=='orb')return;
  var f=FRAGS[i];
  $('cardImg').src=IMG[f.src];
  $('cardCap').textContent=f.cap;
  $('card').classList.add('on');
  $('hint3').classList.remove('on');
  $('orb3').style.pointerEvents='none';
  $('orb3').style.transition='opacity .7s ease, transform .7s ease';
  $('orb3').style.opacity=0;$('orb3').style.transform='scale(.4)';
  $('s3').dataset.step='card';
  setTimeout(function(){
    $('hint3').textContent='轻触继续';
    $('hint3').classList.add('on');
  },1900);
}
function closeCard(){
  if($('s3').dataset.step!=='card')return;
  $('s3').dataset.step='closing';
  $('card').classList.remove('on');
  $('hint3').classList.remove('on');
  var d=$('dot'+fragIdx);if(d)d.classList.add('on');
  burst(W/2,H/2,26,'#ffc6d8',150);
  setTimeout(function(){
    if(fragIdx+1<FRAGS.length)showFrag(fragIdx+1);
    else{
      $('counter').classList.remove('on');
      setTimeout(scene4,700);
    }
  },780);
}

/* --- 场景 4 --- */
var holding=false,holdT=0,HOLD_NEED=2.4;
function scene4(){
  show('s4');
  preloadLetters();
  var el=$('s4').querySelector('.line');
  el.innerHTML='';
  setTimeout(function(){
    typeLine(el,'我把这些日子，\n一颗一颗收好了。',0,.09,function(){
      $('hold').style.transition='opacity 1.4s ease';
      $('hold').style.opacity=1;
    });
  },800);
  $('hold').style.opacity=0;
  setRing(0);
}
var RING=2*Math.PI*45;
function setRing(p){
  var c=$('prog');
  c.style.strokeDasharray=RING;
  c.style.strokeDashoffset=RING*(1-clamp(p,0,1));
}
function finishHold(){
  var s=$('s4');
  burst(W/2,H/2,120,'#ffd6e6',420);
  setTimeout(function(){fade(scene5)},260);
}

/* --- 场景 5：两页信纸 --- */
var LETTER_TURN = 7400;   /* 第一页停留多久后翻页 */
var LETTER_END  = 13200;  /* 第二页停留多久后溶解成字 */
var REPLAY_AT   = 19600;  /* 何时出现「再看一次」 */
var letterStage = '';     /* page1 / page2 / dissolve / done，供验证脚本等待 */

function preloadLetters(){
  LETTERS.forEach(function(k){var im=new Image();im.src=IMG[k]});
}
/* 回到初始态：两张都不可见 */
function letterReset(){
  LETTERS.forEach(function(k){
    var el=$(k);el.classList.remove('on');el.classList.remove('off');
  });
}
/* 溶解态：淡出并微微放大上移 */
function letterHide(){
  LETTERS.forEach(function(k){
    var el=$(k);el.classList.remove('on');el.classList.add('off');
  });
}
/* 翻页：第二页与第一页交叉淡入淡出 */
function turnLetter(){
  var a=$('letter'),b=$('letter2');
  a.classList.remove('on');a.classList.add('off');
  setTimeout(function(){b.classList.add('on');letterStage='page2'},600);
}
function scene5(){
  show('s5');
  starTarget=.55;
  letterStage='page1';
  letterReset();
  $('letter').src=IMG.letter;
  $('letter2').src=IMG.letter2;
  var ln=$('line5');
  ln.innerHTML='';ln.style.transition='';ln.style.opacity=1;
  setTimeout(function(){$('letter').classList.add('on')},260);
  setTimeout(function(){typeLine(ln,'我真的很喜欢你。',0,.2,null)},1600);
  setTimeout(turnLetter,LETTER_TURN);
  setTimeout(function(){
    /* 信纸溶解，粒子汇聚成字 */
    letterStage='dissolve';
    letterHide();
    ln.style.transition='opacity 1.4s ease';ln.style.opacity=0;
    burst(W/2,H/2,80,'#ffd6e6',300);
    buildTextTargets();
    chime();
  },LETTER_END);
  setTimeout(function(){
    letterStage='done';
    $('replay').classList.add('on');
  },REPLAY_AT);
}

/* ============ 交互 ============ */
document.addEventListener('click',function(e){
  if(!AC){initAudio();$('sound').classList.add('on')}
  if(cur==='s1'){
    var r=$('orb1').getBoundingClientRect();
    if(e.clientX<r.left-80||e.clientX>r.right+80||e.clientY<r.top-80||e.clientY>r.bottom+80)return;
    if($('s1').dataset.ready!=='1')return;
    burst(r.left+r.width/2,r.top+r.height/2,60,'#c9c2f5',240);
    chime();
    fade(scene2);
  }else if(cur==='s2'){
    chime();fade(scene3);
  }else if(cur==='s3'){
    var step=$('s3').dataset.step;
    if(step==='orb'){chime();openCard(fragIdx)}
    else if(step==='card'){chime();closeCard()}
  }
});

$('orb3').addEventListener('click',function(e){
  e.stopPropagation();
  if(cur==='s3'&&$('s3').dataset.step==='orb'){chime();openCard(fragIdx)}
});
$('orb1').addEventListener('click',function(e){
  e.stopPropagation();
  if(cur!=='s1'||$('s1').dataset.ready!=='1')return;
  if(!AC){initAudio();$('sound').classList.add('on')}
  var r=this.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2,60,'#c9c2f5',240);
  chime();fade(scene2);
});

var holdEl=$('hold');
function startHold(e){
  if(cur!=='s4')return;
  e.preventDefault();
  if(!AC){initAudio();$('sound').classList.add('on')}
  holding=true;holdT=0;
  holdEl.classList.add('act');
  $('holdTxt').textContent='就快了';
}
function endHold(){
  if(!holding)return;
  holding=false;holdEl.classList.remove('act');
  if(holdT<HOLD_NEED){$('holdTxt').textContent='按住，别松手'}
}
holdEl.addEventListener('pointerdown',startHold);
window.addEventListener('pointerup',endHold);
window.addEventListener('pointercancel',endHold);
holdEl.addEventListener('contextmenu',function(e){e.preventDefault()});

$('replay').addEventListener('click',function(){
  P.phase='idle';P.parts=[];P.burst=[];
  cxF.clearRect(0,0,W,H);
  letterReset();letterStage='';
  $('replay').classList.remove('on');
  $('line5').style.opacity=1;
  $('line5').innerHTML='';
  starTarget=1;
  fade(function(){scene1()});
});

$('sound').addEventListener('click',function(e){e.stopPropagation();soundToggle()});

/* ============ 主循环 ============ */
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,.05);last=now;
  starA=lerp(starA,starTarget,1-Math.pow(.001,dt));
  drawStars(dt);
  drawFX(dt);
  if(holding){
    holdT+=dt;
    setRing(holdT/HOLD_NEED);
    if(holdT>=HOLD_NEED&&cur==='s4'){
      holding=false;holdEl.classList.remove('act');
      $('holdTxt').textContent='';
      finishHold();
    }
  }
  requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,260)});
resize();
requestAnimationFrame(loop);
scene1();
</script>
